[server]
# Required for file uploads on Hugging Face Spaces (iframe blocks XSRF cookies)
enableXsrfProtection = false

# Optional: slimmer top bar (Streamlit ≥1.29). Uncomment if the header still clips custom UI:
# [client]
# toolbarMode = "minimal"

# Shared accent. Light and dark palettes live in [theme.light] / [theme.dark]
# (Streamlit ≥1.51). With both set, the app follows the system setting and
# can still be overridden from the app menu (Settings).
[theme]
primaryColor = "#0d9488"
font = "sans serif"

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1e293b"
borderColor = "#e2e8f0"

[theme.light.sidebar]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"

[theme.dark]
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
borderColor = "#334155"
primaryColor = "#2dd4bf"

[theme.dark.sidebar]
backgroundColor = "#111827"
secondaryBackgroundColor = "#0b1220"
textColor = "#e2e8f0"
primaryColor = "#2dd4bf"

[logger]
level = "error"
